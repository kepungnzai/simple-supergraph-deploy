name: Supergraph Compose & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supergraph-config.yaml'
      - 'app.py'
      - 'router.yaml'
      - '.github/workflows/supergraph-deploy.yaml'
      - 'Dockerfile'
  pull_request:
    branches:
      - main
    paths:
      - 'supergraph-config.yaml'
      - 'app.py'
      - 'router.yaml'

jobs:
  compose-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "strawberry-graphql[fastapi]" uvicorn

      - name: Download Rover CLI
        run: |
          mkdir -p "$HOME/.rover/bin"
          curl -sSL https://rover.apollo.dev/download/linux/x86_64/latest | tar xz -C "$HOME/.rover/bin" rover
          echo "$HOME/.rover/bin" >> $GITHUB_PATH
          rover --version

      - name: Start subgraph service
        run: |
          uvicorn app:app --port 4001 --host 127.0.0.1 > /tmp/subgraph.log 2>&1 &
          SUBGRAPH_PID=$!
          echo "SUBGRAPH_PID=$SUBGRAPH_PID" >> $GITHUB_ENV
          sleep 3
          
          # Verify subgraph is running
          curl -s -X POST http://localhost:4001/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ _service { sdl } }"}' || (cat /tmp/subgraph.log && exit 1)

      - name: Compose Supergraph Schema
        run: |
          rover supergraph compose \
            --config ./supergraph-config.yaml \
            --output ./supergraph-schema.graphql
          
          # Verify schema was created
          if [ ! -f supergraph-schema.graphql ] || [ ! -s supergraph-schema.graphql ]; then
            echo "Error: supergraph-schema.graphql not created or empty"
            exit 1
          fi
          
          echo "✓ Supergraph schema composed successfully"
          wc -l supergraph-schema.graphql

      - name: Validate Schema Syntax
        run: |
          # Basic GraphQL schema validation
          if ! grep -q "type Query" supergraph-schema.graphql; then
            echo "Error: Invalid supergraph schema"
            exit 1
          fi
          echo "✓ Schema syntax validated"

      - name: Kill subgraph service
        if: always()
        run: |
          if [ ! -z "$SUBGRAPH_PID" ]; then
            kill $SUBGRAPH_PID 2>/dev/null || true
          fi

      - name: Upload Supergraph Schema
        uses: actions/upload-artifact@v4
        with:
          name: supergraph-schema
          path: supergraph-schema.graphql
          retention-days: 30

  build-and-push:
    needs: compose-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "strawberry-graphql[fastapi]" uvicorn

      - name: Download Rover CLI
        run: |
          mkdir -p "$HOME/.rover/bin"
          curl -sSL https://rover.apollo.dev/download/linux/x86_64/latest | tar xz -C "$HOME/.rover/bin" rover
          echo "$HOME/.rover/bin" >> $GITHUB_PATH

      - name: Start subgraph service
        run: |
          uvicorn app:app --port 4001 --host 127.0.0.1 > /tmp/subgraph.log 2>&1 &
          SUBGRAPH_PID=$!
          echo "SUBGRAPH_PID=$SUBGRAPH_PID" >> $GITHUB_ENV
          sleep 3

      - name: Compose Supergraph Schema
        run: |
          rover supergraph compose \
            --config ./supergraph-config.yaml \
            --output ./supergraph-schema.graphql

      - name: Kill subgraph service
        if: always()
        run: |
          if [ ! -z "$SUBGRAPH_PID" ]; then
            kill $SUBGRAPH_PID 2>/dev/null || true
          fi


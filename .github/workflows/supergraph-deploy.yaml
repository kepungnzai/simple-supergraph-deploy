name: Supergraph Compose & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supergraph-config.yaml'
      - 'products-subgraph/**'
      - '.github/workflows/supergraph-deploy.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'supergraph-config.yaml'
      - 'products-subgraph/**'

jobs:
  compose-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Rover CLI
        run: |
          curl -sSL https://rover.apollo.dev/nix/latest | sh
          echo "$HOME/.rover/bin" >> $GITHUB_PATH

      - name: Start subgraph services
        run: |
          cd products-subgraph
          python3 -m venv .venv
          source .venv/bin/activate
          pip install "strawberry-graphql[fastapi]" uvicorn
          uvicorn app:app --port 4001 &
          sleep 5

      - name: Compose Supergraph
        run: |
          rover supergraph compose --config ./supergraph-config.yaml --output ./supergraph-schema.graphql

      - name: Validate Supergraph Schema
        run: |
          rover schema check --config ./supergraph-config.yaml

      - name: Upload Supergraph Schema
        uses: actions/upload-artifact@v4
        with:
          name: supergraph-schema
          path: supergraph-schema.graphql
          retention-days: 30

  build-and-push:
    needs: compose-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download Rover CLI
        run: |
          curl -sSL https://rover.apollo.dev/nix/latest | sh
          echo "$HOME/.rover/bin" >> $GITHUB_PATH

      - name: Start subgraph services
        run: |
          cd products-subgraph
          python3 -m venv .venv
          source .venv/bin/activate
          pip install "strawberry-graphql[fastapi]" uvicorn
          uvicorn app:app --port 4001 &
          sleep 5

      - name: Compose Supergraph
        run: |
          rover supergraph compose --config ./supergraph-config.yaml --output ./supergraph-schema.graphql

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/supergraph:latest
            ${{ secrets.REGISTRY_URL }}/supergraph:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max